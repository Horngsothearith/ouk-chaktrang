services:
  web:
    build: .
    image: ouk-chaktrong:latest
    container_name: ouk-chaktrong
    # /api/proxy now refuses any target that is not on the allowlist in
    # scripts/proxy-guard.js, so it is no longer an open relay and this may be
    # widened to "${PORT:-5173}:5173" when the app should be reachable from
    # elsewhere. Loopback stays the default because that is the right default
    # for a service with no authentication of its own.
    ports:
      - "127.0.0.1:${PORT:-5173}:5173"
    environment:
      PORT: 5173
      # Hosts the proxy may forward to, on top of the built-in public API
      # hosts. Adding a loopback or private address here is a deliberate
      # choice: inside a container it points at the container itself.
      PROXY_ALLOWED_HOSTS: "${PROXY_ALLOWED_HOSTS:-}"
    # The server reads each file from disk per request, so this bind mount gives
    # live edits with no rebuild. Read-only: the app never writes to disk.
    volumes:
      - .:/app:ro
    init: true
    restart: unless-stopped

  # One-shot test runner: `docker compose run --rm test`
  # Behind a profile so `docker compose up` doesn't start it.
  test:
    build: .
    image: ouk-chaktrong:latest
    profiles: ["test"]
    command: ["node", "--test"]
    volumes:
      - .:/app:ro
    init: true
